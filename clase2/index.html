<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Research Question Evaluation
    </title>

    <link rel="stylesheet"
          href="style.css">
<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet">
</head>


<body>

<div id="app">

    <img
        src="logo.png"
        class="logo"
        alt="Logo"
    >


    <!-- =====================
         PAGE 1
    ====================== -->

    <section
        id="page1"
        class="page active">

        <h1>
            Research Question Evaluation
        </h1>


        <div id="studentForm">

            <label>
                Select your name
            </label>


            <select id="studentSelect">

                <option value="">
                    Choose...
                </option>

                <option>
                    Catalina Garín
                </option>

                <option>
                    Camila Sandoval
                </option>

                <option>
                    Yamil Tala
                </option>

                <option>
                    Trinidad Valdés
                </option>

                <option>
                    Isabel Véliz
                </option>

            </select>


            <h2>
                Your Research Questions
            </h2>


            <textarea
                id="q1"
                placeholder="Research Question 1">
            </textarea>


            <textarea
                id="q2"
                placeholder="Research Question 2">
            </textarea>


            <textarea
                id="q3"
                placeholder="Research Question 3">
            </textarea>


            <button
                onclick="saveQuestions()">

                Save and Continue

            </button>

        </div>


        <div
            id="submittedMessage"
            class="message"
            style="display:none">

        </div>


        <button
            id="continueButton"
            style="display:none"
            onclick="continueToEvaluation()">

            Continue to Evaluation

        </button>

    </section>


<!-- PAGE 2 -->
<section id="page2" class="page">

    <h2>Choose the 3 strongest research questions</h2>

    <p>
        Select the three questions you consider
        the most interesting and promising.
    </p>

    <div id="selectionCounter" class="counter">
        0 / 3 selected
    </div>

    <div id="waiting" class="waiting">
        Waiting for all students to submit
        their research questions...
    </div>

    <div id="selectionContainer"
         style="display:none">
    </div>

    <div class="nav">

        <button onclick="showPage(1)">
            Back
        </button>

        <button id="reloadButton"
                onclick="checkQuestions()">

            Check for Questions

        </button>

        <button id="submitSelectionButton"
                onclick="saveSelection()"
                style="display:none">

            Submit Selection

        </button>

    </div>

</section>



    <!-- =====================
         PAGE 3
    ====================== -->

    <section
        id="page3"
        class="page">

        <h2>
            Results
        </h2>


        <div id="results">

        </div>


        <div class="nav">

            <button
                onclick="loadResults()">

                Refresh Results

            </button>


            <button
                class="resetButton"
                onclick="resetResults()">

                Reset All Results

            </button>

        </div>

    </section>

</div>


<script src="script.js"></script>

</body>

</html>
