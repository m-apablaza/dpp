<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Research Question Evaluation</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

<div id="app">

    <!-- PAGE 1 -->

    <section id="page1"
             class="page active">

        <h1>Research Question Evaluation</h1>

        <label>
            Select your name
        </label>

        <select id="studentSelect">

            <option value="">
                Choose...
            </option>

            <option>
                Catalina Garín
            </option>

            <option>
                Camila Sandoval
            </option>

            <option>
                Yamil Tala
            </option>

            <option>
                Trinidad Valdés
            </option>

            <option>
                Isabel Véliz
            </option>

        </select>


        <h2>
            Your Research Questions
        </h2>


        <textarea id="q1"
                  placeholder="Research Question 1">
        </textarea>


        <textarea id="q2"
                  placeholder="Research Question 2">
        </textarea>


        <textarea id="q3"
                  placeholder="Research Question 3">
        </textarea>


        <button onclick="saveQuestions()">
            Save and Continue
        </button>

    </section>


    <!-- PAGE 2 -->

    <section id="page2"
             class="page">

        <h2>
            Evaluate the Research Questions
        </h2>

        <p>
            Rate each question from
            <strong>1 to 7</strong>.
        </p>

        <p>
            1 = Poor &nbsp;&nbsp;&nbsp;
            7 = Excellent
        </p>


        <div id="ratingContainer">
        </div>


        <div class="nav">

            <button onclick="showPage(1)">
                Back
            </button>

            <button onclick="saveRatings()">
                Submit Ratings
            </button>

        </div>

    </section>


    <!-- PAGE 3 -->

    <section id="page3"
             class="page">

        <h2>
            Results
        </h2>

        <div id="results">
        </div>


        <button class="resetButton"
                onclick="resetResults()">

            Reset All Results

        </button>

    </section>

</div>


<script src="script.js"></script>

</body>

</html>
