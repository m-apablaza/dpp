<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escritura Académica - UDD Doctorado</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Fondo Matrix */
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        .matrix-bg canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Capa oscura sobre el Matrix */
        .matrix-bg::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1;
        }

        .container {
            text-align: center;
            z-index: 10;
            max-width: 800px;
            padding: 40px;
        }

        .title {
            font-size: 58px;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            animation: glow 2s ease-in-out infinite;
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 20px;
            letter-spacing: 2px;
            color: #ffffff;
            opacity: 0.9;
        }

        .buttons-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 50px;
        }

        .pill {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            font-family: 'Courier New', monospace;
            color: #ffffff;
        }

        /* BOTÓN AZUL NAVY */
        .pill-blue {
            background: #0B1F3A;
            color: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(11, 31, 58, 0.9);
        }

        .pill-blue:hover {
            background: #102C52;
            box-shadow:
                0 0 30px rgba(30, 70, 120, 0.9),
                inset 0 0 20px rgba(255, 255, 255, 0.15);
            transform: scale(1.1);
        }

        /* BOTÓN ROJO/MARRÓN */
        .pill-red {
            background: #6B2525;
            color: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(107, 37, 37, 0.9);
        }

        .pill-red:hover {
            background: #803030;
            box-shadow:
                0 0 30px rgba(130, 45, 45, 0.9),
                inset 0 0 20px rgba(255, 255, 255, 0.15);
            transform: scale(1.1);
        }

        .question {
            margin-top: 60px;
            font-size: 16px;
            color: #ffffff;
            opacity: 0.7;
            animation: blink 1.5s ease-in-out infinite;
        }

        .final-text {
            margin-top: 15px;
            font-size: 14px;
            color: #ffffff;
            opacity: 0.55;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
            }

            50% {
                text-shadow:
                    0 0 25px rgba(255, 255, 255, 0.5),
                    0 0 45px rgba(255, 255, 255, 0.2);
            }
        }

        @keyframes blink {
            0%, 100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        @media (max-width: 600px) {

            .title {
                font-size: 32px;
            }

            .subtitle {
                font-size: 14px;
            }

            .pill {
                width: 100px;
                height: 100px;
                font-size: 18px;
            }

            .buttons-container {
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="matrix-bg">
        <canvas id="matrixCanvas"></canvas>
    </div>

    <div class="container">

        <div class="title">
            ESCRITURA ACADÉMICA
        </div>

        <div class="subtitle">
            Doctorado en Políticas Públicas
        </div>

        <div class="subtitle">
            Facultad de Gobierno | Universidad del Desarrollo
        </div>

        <div class="buttons-container">

            <a href="curso.html" class="pill pill-blue">
                AZUL
            </a>

            <a href="schpp.html" class="pill pill-red">
                ROJA
            </a>

        </div>

        <div class="question">
            ¿Cuál elegirás?
        </div>

        <div class="final-text">
            No way back... (al menos hasta la siguiente semana).
        </div>

    </div>


    <script>

        // Matrix effect

        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars =
            '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';

        const fontSize = 16;

        const columns = Math.floor(canvas.width / fontSize);

        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = Math.random() * canvas.height / fontSize;
        }

        function draw() {

            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px Courier New';

            for (let i = 0; i < drops.length; i++) {

                const char =
                    chars[Math.floor(Math.random() * chars.length)];

                ctx.fillText(
                    char,
                    i * fontSize,
                    drops[i] * fontSize
                );

                if (
                    drops[i] * fontSize > canvas.height &&
                    Math.random() > 0.975
                ) {
                    drops[i] = 0;
                }

                drops[i]++;
            }
        }

        setInterval(draw, 50);

        window.addEventListener('resize', () => {

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

        });

    </script>

</body>
</html>
